<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÖVE Web Executor + Debug</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #f3f3f7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #drop-zone {
            width: 400px;
            padding: 40px;
            border: 2px dashed #444;
            border-radius: 12px;
            text-align: center;
            background: #18181f;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #drop-zone:hover {
            border-color: #ff4757;
            background: #202028;
        }
        #canvas {
            display: none;
            background-color: #000;
            outline: none;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 15px;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #debug-box {
            width: 100%;
            max-width: 700px;
            height: 180px;
            background: #09090c;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #00ffcc;
            overflow-y: auto;
            white-space: pre-wrap;
            box-sizing: border-box;
            text-align: left;
            display: none;
        }
        .error-log {
            color: #ff5252;
        }
    </style>
</head>
<body>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h2>LÖVE Web Executor</h2>
        <p style="color: #888; margin-top: 8px;">Drop any <code>.love</code> file here or click to browse</p>
        <button class="btn">Select .love file</button>
        <input type="file" id="file-input" accept=".love" style="display: none;">
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <div id="debug-box"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const debugBox = document.getElementById('debug-box');

        function logToDebug(text, isError = false) {
            debugBox.style.display = 'block';
            const span = document.createElement('div');
            if (isError) span.className = 'error-log';
            span.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            debugBox.appendChild(span);
            debugBox.scrollTop = debugBox.scrollHeight;
            console.log(text);
        }

        window.onerror = function(msg, url, line) {
            logToDebug(`Global JS Error: ${msg} (line ${line})`, true);
        };

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ff4757';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#444';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) {
                bootGame(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                bootGame(e.target.files[0]);
            }
        });

        function bootGame(file) {
            if (!file.name.endsWith('.love')) {
                alert('Bruh, that is not a valid .love file.');
                return;
            }

            dropZone.style.display = 'none';
            const canvas = document.getElementById('canvas');
            canvas.style.display = 'block';

            logToDebug(`Loading file: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)...`);

            const reader = new FileReader();
            reader.onload = function(evt) {
                const fileData = new Uint8Array(evt.target.result);
                logToDebug("File read successfully into ArrayBuffer.");

                window.Module = {
                    canvas: canvas,
                    arguments: ['game.love'],
                    print: function(text) {
                        logToDebug("Emscripten: " + text);
                    },
                    printErr: function(text) {
                        logToDebug("Emscripten Error: " + text, true);
                    },
                    preRun: [function() {
                        logToDebug("Mounting 'game.love' to virtual filesystem...");
                        FS.createDataFile('/', 'game.love', fileData, true, true, true);
                        logToDebug("Virtual filesystem mount complete.");
                    }],
                    locateFile: function(path) {
                        logToDebug("Locating asset/wasm: " + path);
                        if (path.endsWith('.wasm')) {
                            return 'https://cdn.jsdelivr.net/gh/2dengine/love.js@latest/11.5/love.wasm';
                        }
                        return path;
                    }
                };

                logToDebug("Injecting love.js runtime script from CDN...");
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/gh/2dengine/love.js@latest/11.5/love.js';
                
                script.onload = function() {
                    logToDebug("love.js script loaded successfully from CDN!");
                };
                
                script.onerror = function(err) {
                    logToDebug("Failed to load love.js script from CDN! Check network/CORS.", true);
                };

                document.body.appendChild(script);
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
