<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÖVE Web Executor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0f0f13;
            color: #f3f3f7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #drop-zone {
            width: 400px;
            padding: 40px;
            border: 2px dashed #444;
            border-radius: 12px;
            text-align: center;
            background: #18181f;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #drop-zone:hover {
            border-color: #ff4757;
            background: #202028;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #loading-status {
            display: none;
            margin-top: 20px;
            color: #00ffcc;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h2>LÖVE Web Executor</h2>
        <p style="color: #888; margin-top: 8px;">Drop any <code>.love</code> file here or click to browse</p>
        <button class="btn">Select .love file</button>
        <input type="file" id="file-input" accept=".love" style="display: none;">
    </div>

    <div id="loading-status">Preparing game container...</div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loadingStatus = document.getElementById('loading-status');

        // Check if the URL already has a game passed to it via player.js format
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('g')) {
            dropZone.style.display = 'none';
            // Load the official player script if a game is bound in the URL query
            const playerScript = document.createElement('script');
            playerScript.src = 'player.js';
            document.body.appendChild(playerScript);
        }

        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.love')) {
                alert('Bruh, that is not a valid .love file.');
                return;
            }

            dropZone.style.display = 'none';
            loadingStatus.style.display = 'block';
            loadingStatus.textContent = `Packaging ${file.name} into virtual stream...`;

            // Read file into an ArrayBuffer and store it temporarily in sessionStorage
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    // Store binary data in session storage to pass across the reload boundary
                    const base64Data = btoa(
                        String.fromCharCode.apply(null, new Uint8Array(evt.target.result))
                    );
                    sessionStorage.setItem('love_game_data', base64Data);
                    sessionStorage.setItem('love_game_name', file.name);

                    loadingStatus.textContent = 'Booting up LÖVE Web Runtime...';
                    
                    // Reload page with player.js parameters, letting player.js pull from session data or standard load
                    // Alternatively, we can inject player.js directly with the blob URL:
                    const blob = new Blob([evt.target.result], { type: 'application/octet-stream' });
                    const blobUrl = URL.createObjectURL(blob);
                    
                    // Clear out body elements and let player.js take over the DOM completely
                    document.body.innerHTML = '<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>';
                    
                    window.Module = {
                        arguments: [file.name],
                        preRun: [function() {
                            FS.createDataFile('/', file.name, new Uint8Array(evt.target.result), true, true, true);
                        }]
                    };

                    const script = document.createElement('script');
                    script.src = 'player.js?g=' + encodeURIComponent(blobUrl) + '&n=1';
                    document.body.appendChild(script);

                } catch (err) {
                    loadingStatus.textContent = 'Error loading game: ' + err.message;
                    loadingStatus.style.color = '#ff5252';
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
