<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÖVE Web Executor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0f0f13;
            color: #f3f3f7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #version-tag {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            z-index: 999999;
            pointer-events: none;
        }
        #fs-btn {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }
        #fs-btn:hover {
            background: #ff6b78;
        }
        #drop-zone {
            width: 400px;
            padding: 40px;
            border: 2px dashed #444;
            border-radius: 12px;
            text-align: center;
            background: #18181f;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }
        #drop-zone:hover {
            border-color: #ff4757;
            background: #202028;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #loading-status {
            display: none;
            margin-top: 20px;
            color: #00ffcc;
            font-family: monospace;
            z-index: 10;
        }
        #canvas {
            display: none;
            background-color: #000;
            outline: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Tabbed Debug Overlay */
        #debug-overlay {
            display: none;
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 220px;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #ff4757;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #00ffcc;
            z-index: 999999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }
        #debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .tab-btn {
            background: #18181f;
            border: 1px solid #444;
            color: #888;
            padding: 4px 10px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            margin-right: 4px;
        }
        .tab-btn.active {
            background: #ff4757;
            color: #fff;
            border-color: #ff4757;
        }
        .debug-tab-content {
            display: none;
            height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            text-align: left;
        }
        .debug-tab-content.active {
            display: block;
        }
        .error-log {
            color: #ff5252;
        }
        #debug-hint {
            position: fixed;
            bottom: 5px;
            right: 10px;
            font-size: 10px;
            color: #555;
            z-index: 999998;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="version-tag">v1.19</div>
    <button id="fs-btn" onclick="goFullscreen()">[⤢] Fullscreen Canvas</button>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h2>LÖVE Web Executor</h2>
        <p style="color: #888; margin-top: 8px;">Drop any <code>.love</code> file here or click to browse</p>
        <button class="btn">Select .love file</button>
        <input type="file" id="file-input" accept=".love" style="display: none;">
    </div>

    <div id="loading-status">Preparing game container...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <div id="debug-hint">Type 'debug' to toggle console</div>
    <div id="debug-overlay">
        <div id="debug-header">
            <div>
                <button id="tab-sys-btn" class="tab-btn active" onclick="switchTab('sys')">System Console</button>
                <button id="tab-game-btn" class="tab-btn" onclick="switchTab('game')">Game Output</button>
            </div>
            <button onclick="toggleDebug(false)" style="background: #222; border: 1px solid #444; color: #fff; padding: 2px 8px; border-radius: 4px; cursor: pointer;">Close [X]</button>
        </div>
        <div id="tab-sys" class="debug-tab-content active"></div>
        <div id="tab-game" class="debug-tab-content"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loadingStatus = document.getElementById('loading-status');
        const canvas = document.getElementById('canvas');
        const fsBtn = document.getElementById('fs-btn');

        function logToSys(text, isError = false) {
            const timeStr = new Date().toLocaleTimeString();
            appendLog('tab-sys', `[${timeStr}] ${text}`, isError);
            console.log("Sys: " + text);
        }

        function logToGame(text, isError = false) {
            const timeStr = new Date().toLocaleTimeString();
            appendLog('tab-game', `[${timeStr}] ${text}`, isError);
            if (isError) switchTab('game');
            console.log("Game: " + text);
        }

        function appendLog(targetId, msg, isError) {
            const container = document.getElementById(targetId);
            if (container) {
                const div = document.createElement('div');
                if (isError) div.className = 'error-log';
                div.textContent = msg;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }
        }

        function switchTab(tabName) {
            document.getElementById('tab-sys-btn').classList.toggle('active', tabName === 'sys');
            document.getElementById('tab-game-btn').classList.toggle('active', tabName === 'game');
            document.getElementById('tab-sys').classList.toggle('active', tabName === 'sys');
            document.getElementById('tab-game').classList.toggle('active', tabName === 'game');
        }

        window.onerror = function(msg, url, line) {
            logToSys(`JS Error: ${msg} (line ${line})`, true);
        };

        let typedKeys = '';
        window.addEventListener('keydown', (e) => {
            typedKeys += e.key.toLowerCase();
            if (typedKeys.length > 5) typedKeys = typedKeys.slice(-5);
            if (typedKeys === 'debug') {
                const overlay = document.getElementById('debug-overlay');
                if (overlay) toggleDebug(overlay.style.display !== 'block');
            }
        });

        function toggleDebug(show) {
            const overlay = document.getElementById('debug-overlay');
            if (overlay) {
                overlay.style.display = show ? 'block' : 'none';
            }
        }

        function goFullscreen() {
            if (canvas.requestFullscreen) canvas.requestFullscreen();
            else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
            canvas.focus();
            logToSys("Fullscreen requested and canvas focused.");
        }

        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.love')) {
                alert('Bruh, that is not a valid .love file.');
                return;
            }

            dropZone.style.display = 'none';
            loadingStatus.style.display = 'block';
            loadingStatus.textContent = `Reading ${file.name}...`;
            logToSys(`Reading file into memory: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);

            const reader = new FileReader();
            reader.onload = function(evt) {
                const fileData = new Uint8Array(evt.target.result);
                logToSys("File read complete. Pre-configuring Engine...");

                loadingStatus.style.display = 'none';
                canvas.style.display = 'block';
                fsBtn.style.display = 'block';
                toggleDebug(true);

                canvas.width = 1280;
                canvas.height = 720;
                canvas.focus();

                const engineConfig = {
                    canvas: canvas,
                    arguments: ['game.love'],
                    INITIAL_MEMORY: 268435456,
                    ALLOW_MEMORY_GROWTH: true,
                    print: function(text) {
                        logToGame(text, false);
                    },
                    printErr: function(text) {
                        logToGame(text, true);
                    },
                    onAbort: function(what) {
                        logToSys("WASM Abort triggered: " + what, true);
                    },
                    preRun: [function() {
                        logToSys("Mounting game package to virtual filesystem...");
                        const targetFS = (typeof Love !== 'undefined' && Love.FS) ? Love.FS : FS;
                        try {
                            targetFS.createDataFile('/', 'game.love', fileData, true, true, true);
                            logToSys("Mount successful at /game.love!");
                        } catch (err) {
                            logToSys("FS Mount Warning: " + err.message, true);
                        }
                    }],
                    locateFile: function(path) {
                        if (path.endsWith('.wasm')) return '11.5/love.wasm';
                        return '11.5/' + path;
                    }
                };

                logToSys("Loading 11.5/love.js script...");
                const script = document.createElement('script');
                script.src = '11.5/love.js';
                script.onload = function() {
                    logToSys("11.5/love.js loaded. Initializing Engine Promise...");
                    if (typeof window.Love === 'function') {
                        window.Love(engineConfig).then(function(instance) {
                            logToSys("WASM Module Promise resolved successfully! Engine active.");
                        }).catch(function(err) {
                            logToSys("WASM Initialization Error: " + err, true);
                        });
                    } else {
                        logToSys("Error: window.Love constructor not found!", true);
                    }
                };
                script.onerror = function() {
                    logToSys("Failed to fetch 11.5/love.js engine script!", true);
                };
                document.body.appendChild(script);
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
