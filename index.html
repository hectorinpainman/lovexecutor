<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÖVE Web Executor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0f0f13;
            color: #f3f3f7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #drop-zone {
            width: 400px;
            padding: 40px;
            border: 2px dashed #444;
            border-radius: 12px;
            text-align: center;
            background: #18181f;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #drop-zone:hover {
            border-color: #ff4757;
            background: #202028;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h2>LÖVE Web Executor</h2>
        <p style="color: #888; margin-top: 8px;">Drop any <code>.love</code> file here or click to browse</p>
        <button class="btn">Select .love file</button>
        <input type="file" id="file-input" accept=".love" style="display: none;">
    </div>

    <!-- Hidden canvas container that player.js looks for -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.love')) {
                alert('Not a .love file!');
                return;
            }

            dropZone.style.display = 'none';

            // Create an object URL for the uploaded file so player.js can fetch it locally via virtual blob
            const fileURL = URL.createObjectURL(file);

            // Dynamically inject the official player.js with the game parameter pointed at our blob URL
            window.Module = {
                arguments: [file.name],
                preRun: [function() {
                    FS.createDataFile('/', 'game.love', file, true, true, true);
                }]
            };

            // Alternatively, setting up the search parameter trick that player.js natively reads:
            const script = document.createElement('script');
            script.src = 'player.js?g=' + encodeURIComponent(fileURL);
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
