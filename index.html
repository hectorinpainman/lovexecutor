<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÖVE Web Executor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0f0f13;
            color: #f3f3f7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #version-tag {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            z-index: 999999;
            pointer-events: none;
        }
        #drop-zone {
            width: 400px;
            padding: 40px;
            border: 2px dashed #444;
            border-radius: 12px;
            text-align: center;
            background: #18181f;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }
        #drop-zone:hover {
            border-color: #ff4757;
            background: #202028;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #loading-status {
            display: none;
            margin-top: 20px;
            color: #00ffcc;
            font-family: monospace;
            z-index: 10;
        }
        #canvas {
            display: none;
            background-color: #000;
            outline: none;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #debug-overlay {
            display: none;
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-height: 220px;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #ff4757;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #00ffcc;
            overflow-y: auto;
            z-index: 999999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            text-align: left;
        }
        .error-log {
            color: #ff5252;
        }
        #debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        #debug-hint {
            position: fixed;
            bottom: 5px;
            right: 10px;
            font-size: 10px;
            color: #555;
            z-index: 999998;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="version-tag">v1.14</div>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h2>LÖVE Web Executor</h2>
        <p style="color: #888; margin-top: 8px;">Drop any <code>.love</code> file here or click to browse</p>
        <button class="btn">Select .love file</button>
        <input type="file" id="file-input" accept=".love" style="display: none;">
    </div>

    <div id="loading-status">Preparing game container...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <div id="debug-hint">Type 'debug' to toggle console</div>
    <div id="debug-overlay">
        <div id="debug-header">
            <span style="font-weight: bold; color: #ff4757;">LÖVE RUNTIME DEBUG CONSOLE</span>
            <button onclick="toggleDebug(false)" style="background: #222; border: 1px solid #444; color: #fff; padding: 2px 8px; border-radius: 4px; cursor: pointer;">Close [X]</button>
        </div>
        <div id="debug-logs"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loadingStatus = document.getElementById('loading-status');
        const canvas = document.getElementById('canvas');

        window.debugLogBuffer = [];

        function logToDebug(text, isError = false) {
            const timeStr = new Date().toLocaleTimeString();
            const logMsg = `[${timeStr}] ${text}`;
            window.debugLogBuffer.push({ msg: logMsg, error: isError });
            
            const logsContainer = document.getElementById('debug-logs');
            if (logsContainer) {
                const div = document.createElement('div');
                if (isError) div.className = 'error-log';
                div.textContent = logMsg;
                logsContainer.appendChild(div);
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }
            console.log(text);
        }

        window.onerror = function(msg, url, line) {
            logToDebug(`JS Error: ${msg} (line ${line})`, true);
        };

        let typedKeys = '';
        window.addEventListener('keydown', (e) => {
            typedKeys += e.key.toLowerCase();
            if (typedKeys.length > 5) typedKeys = typedKeys.slice(-5);
            if (typedKeys === 'debug') {
                const overlay = document.getElementById('debug-overlay');
                if (overlay) toggleDebug(overlay.style.display !== 'block');
            }
        });

        function toggleDebug(show) {
            const overlay = document.getElementById('debug-overlay');
            if (overlay) {
                overlay.style.display = show ? 'block' : 'none';
                if (show) {
                    const logsContainer = document.getElementById('debug-logs');
                    logsContainer.innerHTML = '';
                    window.debugLogBuffer.forEach(item => {
                        const div = document.createElement('div');
                        if (item.error) div.className = 'error-log';
                        div.textContent = item.msg;
                        logsContainer.appendChild(div);
                    });
                    logsContainer.scrollTop = logsContainer.scrollHeight;
                }
            }
        }

        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.love')) {
                alert('Bruh, that is not a valid .love file.');
                return;
            }

            dropZone.style.display = 'none';
            loadingStatus.style.display = 'block';
            loadingStatus.textContent = `Reading ${file.name}...`;
            logToDebug(`Reading file into memory: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);

            const reader = new FileReader();
            reader.onload = function(evt) {
                const fileData = new Uint8Array(evt.target.result);
                logToDebug("File read complete. Pre-configuring Emscripten Module...");

                loadingStatus.style.display = 'none';
                canvas.style.display = 'block';
                toggleDebug(true);

                canvas.width = 800;
                canvas.height = 600;

                window.Module = {
                    canvas: canvas,
                    arguments: ['game.love'],
                    INITIAL_MEMORY: 268435456,
                    ALLOW_MEMORY_GROWTH: true,
                    print: function(text) {
                        logToDebug("Engine: " + text);
                    },
                    printErr: function(text) {
                        logToDebug("Engine Error: " + text, true);
                    },
                    onAbort: function(what) {
                        logToDebug("WASM Abort triggered: " + what, true);
                    },
                    preRun: [function() {
                        logToDebug("Mounting 'game.love' to virtual filesystem...");
                        try {
                            FS.createDataFile('/', 'game.love', fileData, true, true, true);
                            logToDebug("Mount successful.");
                        } catch (err) {
                            logToDebug("FS Mount Error: " + err.message, true);
                        }
                    }],
                    locateFile: function(path) {
                        if (path.endsWith('.wasm')) return '11.5/love.wasm';
                        return '11.5/' + path;
                    }
                };

                logToDebug("Loading 11.5/love.js script...");
                const script = document.createElement('script');
                script.src = '11.5/love.js';
                script.onload = function() {
                    logToDebug("11.5/love.js loaded into DOM.");
                    if (typeof window.Love === 'function') {
                        logToDebug("Initializing via window.Love(window.Module)...");
                        window.Love(window.Module);
                    } else if (typeof window.love === 'function') {
                        logToDebug("Initializing via window.love(window.Module)...");
                        window.love(window.Module);
                    } else {
                        logToDebug("Engine script auto-initialized via Emscripten Module window scope.");
                    }
                };
                script.onerror = function() {
                    logToDebug("Failed to fetch 11.5/love.js engine script!", true);
                };
                document.body.appendChild(script);
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
