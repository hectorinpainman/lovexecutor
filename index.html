<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÖVE Browser Executor</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #f3f3f7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #drop-zone {
            width: 400px;
            padding: 40px;
            border: 2px dashed #444;
            border-radius: 12px;
            text-align: center;
            background: #18181f;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #drop-zone:hover {
            border-color: #ff4757;
            background: #202028;
        }
        #canvas {
            display: none;
            background-color: #000;
            outline: none;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h2>LÖVE Web Executor</h2>
        <p style="color: #888; margin-top: 8px;">Drop any <code>.love</code> file here or click to browse</p>
        <button class="btn">Select .love file</button>
        <input type="file" id="file-input" accept=".love" style="display: none;">
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ff4757';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#444';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) {
                bootGame(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                bootGame(e.target.files[0]);
            }
        });

        function bootGame(file) {
            if (!file.name.endsWith('.love')) {
                alert('Bruh, that is not a valid .love file.');
                return;
            }

            dropZone.style.display = 'none';
            const canvas = document.getElementById('canvas');
            canvas.style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(evt) {
                const fileData = new Uint8Array(evt.target.result);

                // Configure Module for Emscripten & love.js
                window.Module = {
                    canvas: canvas,
                    arguments: ['game.love'],
                    preRun: [function() {
                        // Mount the dropped file data directly into Emscripten virtual filesystem
                        FS.createDataFile('/', 'game.love', fileData, true, true, true);
                    }],
                    locateFile: function(path) {
                        // Force WASM binary to pull from the CDN cleanly
                        if (path.endsWith('.wasm')) {
                            return 'https://cdn.jsdelivr.net/gh/2dengine/love.js@latest/11.5/love.wasm';
                        }
                        return path;
                    }
                };

                // Dynamically inject the love.js core runtime engine
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/gh/2dengine/love.js@latest/11.5/love.js';
                document.body.appendChild(script);
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
